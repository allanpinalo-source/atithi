<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img" aria-labelledby="t">
  <title id="t">Illustration of the Atithi Bar Arena: neon sign, big screen showing football, backlit bottles, bar counter and stools</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1224"/>
      <stop offset="0.65" stop-color="#080b16"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <pattern id="brick" width="60" height="28" patternUnits="userSpaceOnUse">
      <rect width="60" height="28" fill="none"/>
      <path d="M0 0.5H60M0 14.5H60M30 0V14M0 14V28M60 14V28" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="soft-s" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d48a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6d48a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a12"/>
      <stop offset="1" stop-color="#d4a94f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5130"/>
      <stop offset="1" stop-color="#3c1f10"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b100c"/>
      <stop offset="1" stop-color="#0d0806"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="0.45" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fa84f"/>
      <stop offset="1" stop-color="#17702f"/>
    </linearGradient>
    <linearGradient id="shelfglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4a94f" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4a94f" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b4a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff3b4a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <symbol id="bottle" viewBox="0 0 20 60">
      <path fill="currentColor" d="M7 0H13V14Q18 18 18 26V57Q18 60 15 60H5Q2 60 2 57V26Q2 18 7 14Z"/>
      <rect x="4" y="33" width="12" height="11" rx="1" fill="#f4ecdc" fill-opacity="0.55"/>
      <path d="M5 22Q5 19 8 17" stroke="#fff" stroke-opacity="0.45" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Room -->
  <rect width="600" height="720" fill="url(#bg)"/>
  <rect width="600" height="470" fill="url(#brick)"/>
  <circle cx="110" cy="560" r="200" fill="#c4252f" opacity="0.28" filter="url(#soft)"/>
  <circle cx="480" cy="330" r="170" fill="#22c55e" opacity="0.16" filter="url(#soft)"/>
  <circle cx="300" cy="170" r="160" fill="#ff4d5a" opacity="0.14" filter="url(#soft)"/>

  <!-- Pendant lights -->
  <g>
    <path d="M150 0V58M300 0V40M450 0V58" stroke="#3b3b3b" stroke-width="2"/>
    <polygon points="132,78 168,78 250,470 50,470" fill="url(#beam)" opacity="0.5"/>
    <polygon points="432,78 468,78 550,470 350,470" fill="url(#beam)" opacity="0.5"/>
    <path d="M136 78 L142 58 H158 L164 78 Z" fill="url(#lamp)"/>
    <path d="M436 78 L442 58 H458 L464 78 Z" fill="url(#lamp)"/>
    <ellipse cx="150" cy="79" rx="14" ry="3" fill="#ffe7a8" filter="url(#glow)"/>
    <ellipse cx="450" cy="79" rx="14" ry="3" fill="#ffe7a8" filter="url(#glow)"/>
  </g>

  <!-- Neon sign -->
  <g text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif">
    <text x="300" y="112" font-size="18" letter-spacing="10" fill="#e8c987" font-weight="700">ATITHI</text>
    <rect x="118" y="126" width="364" height="76" rx="14" fill="none" stroke="#ff4d5a" stroke-width="2.5" filter="url(#glow)"/>
    <text x="300" y="185" font-size="54" font-weight="900" letter-spacing="3" fill="#fff1f2" stroke="#ff4d5a" stroke-width="2" filter="url(#glow)">BAR ARENA</text>
    <text x="300" y="232" font-size="13" letter-spacing="5" fill="#f4ecdc" fill-opacity="0.75" font-family="Arial, sans-serif" font-weight="700">LIVE SPORTS · COLD DRINKS · COCKTAILS</text>
  </g>

  <!-- Backlit bottle shelves -->
  <g>
    <rect x="28" y="262" width="270" height="190" rx="6" fill="url(#shelfglow)"/>
    <rect x="28" y="262" width="270" height="190" rx="6" fill="none" stroke="#d4a94f" stroke-opacity="0.35"/>
    <rect x="28" y="352" width="270" height="4" fill="#d4a94f" opacity="0.8"/>
    <rect x="28" y="448" width="270" height="4" fill="#d4a94f" opacity="0.8"/>
    <g>
      <use href="#bottle" x="44" y="294" width="20" height="58" style="color:#7a3b12"/>
      <use href="#bottle" x="70" y="290" width="22" height="62" style="color:#1f5f2e"/>
      <use href="#bottle" x="98" y="300" width="18" height="52" style="color:#c7d2fe"/>
      <use href="#bottle" x="122" y="288" width="22" height="64" style="color:#a3561d"/>
      <use href="#bottle" x="150" y="296" width="20" height="56" style="color:#2563eb"/>
      <use href="#bottle" x="176" y="292" width="22" height="60" style="color:#5b1a1a"/>
      <use href="#bottle" x="204" y="298" width="18" height="54" style="color:#e5e7eb"/>
      <use href="#bottle" x="228" y="290" width="22" height="62" style="color:#b45309"/>
      <use href="#bottle" x="256" y="296" width="20" height="56" style="color:#14532d"/>
    </g>
    <g>
      <use href="#bottle" x="46" y="390" width="20" height="58" style="color:#be123c"/>
      <use href="#bottle" x="72" y="384" width="22" height="64" style="color:#92400e"/>
      <use href="#bottle" x="100" y="394" width="18" height="54" style="color:#fde68a"/>
      <use href="#bottle" x="124" y="388" width="22" height="60" style="color:#0f766e"/>
      <use href="#bottle" x="152" y="392" width="20" height="56" style="color:#7c2d12"/>
      <use href="#bottle" x="178" y="386" width="22" height="62" style="color:#4c1d95"/>
      <use href="#bottle" x="206" y="394" width="18" height="54" style="color:#d6d3d1"/>
      <use href="#bottle" x="230" y="388" width="22" height="60" style="color:#a16207"/>
      <use href="#bottle" x="258" y="392" width="20" height="56" style="color:#166534"/>
    </g>
  </g>

  <!-- Big screen -->
  <g>
    <rect x="328" y="270" width="244" height="148" rx="10" fill="#22c55e" opacity="0.35" filter="url(#soft-s)"/>
    <rect x="328" y="270" width="244" height="148" rx="8" fill="#0a0a0a" stroke="#2b2b2b" stroke-width="2"/>
    <rect x="336" y="278" width="228" height="132" rx="3" fill="url(#pitch)"/>
    <g stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.5" fill="none">
      <rect x="346" y="288" width="208" height="112"/>
      <path d="M450 288V400"/>
      <circle cx="450" cy="344" r="16"/>
      <rect x="346" y="320" width="22" height="48"/>
      <rect x="532" y="320" width="22" height="48"/>
    </g>
    <g>
      <circle cx="410" cy="330" r="3.2" fill="#ef4444"/><circle cx="430" cy="360" r="3.2" fill="#ef4444"/><circle cx="395" cy="372" r="3.2" fill="#ef4444"/><circle cx="470" cy="312" r="3.2" fill="#ef4444"/>
      <circle cx="488" cy="350" r="3.2" fill="#1d4ed8"/><circle cx="505" cy="322" r="3.2" fill="#1d4ed8"/><circle cx="462" cy="376" r="3.2" fill="#1d4ed8"/><circle cx="520" cy="366" r="3.2" fill="#1d4ed8"/>
      <circle cx="452" cy="340" r="2.2" fill="#ffffff"/>
    </g>
    <rect x="342" y="284" width="64" height="14" rx="2" fill="#0b1426" fill-opacity="0.9"/>
    <text x="374" y="294.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">LIVE  2 – 1</text>
    <circle cx="555" cy="291" r="3" fill="#ef4444"/>
    <rect x="444" y="418" width="12" height="20" fill="#1f1f1f"/>
  </g>

  <!-- Counter top -->
  <rect x="0" y="468" width="600" height="24" fill="url(#wood)"/>
  <rect x="0" y="466" width="600" height="3" fill="#e8c987" opacity="0.9"/>

  <!-- Drinks on the counter -->
  <g>
    <!-- martini -->
    <circle cx="188" cy="440" r="26" fill="#f05a7e" opacity="0.35" filter="url(#soft-s)"/>
    <polygon points="168,428 208,428 188,452" fill="#f05a7e" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="187" y="452" width="2" height="12" fill="#ffffff" fill-opacity="0.7"/>
    <ellipse cx="188" cy="465" rx="9" ry="2" fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="205" cy="428" r="5" fill="#a3e635" stroke="#ecfccb" stroke-width="1"/>
    <!-- highball blue -->
    <circle cx="300" cy="440" r="26" fill="#38bdf8" opacity="0.35" filter="url(#soft-s)"/>
    <rect x="290" y="424" width="20" height="42" rx="2" fill="#38bdf8" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
    <path d="M304 424 L312 404" stroke="#e8c987" stroke-width="2" stroke-linecap="round"/>
    <rect x="293" y="430" width="7" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.45"/>
    <!-- beer -->
    <circle cx="410" cy="440" r="26" fill="#f59e0b" opacity="0.35" filter="url(#soft-s)"/>
    <path d="M398 426 H420 L418 466 H400 Z" fill="#f59e0b" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M397 426 Q402 418 409 422 Q415 416 421 426 Z" fill="#fff7ed"/>
    <path d="M420 434 Q428 436 427 446 Q426 454 419 454" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" fill="none"/>
  </g>

  <!-- Counter front -->
  <rect x="0" y="492" width="600" height="146" fill="url(#front)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <path d="M30 492V636M60 492V636M90 492V636M120 492V636M150 492V636M180 492V636M210 492V636M240 492V636M270 492V636M300 492V636M330 492V636M360 492V636M390 492V636M420 492V636M450 492V636M480 492V636M510 492V636M540 492V636M570 492V636"/>
  </g>
  <rect x="0" y="630" width="600" height="5" fill="#ff3b4a" filter="url(#glow)"/>

  <!-- Floor -->
  <rect x="0" y="638" width="600" height="82" fill="#05070d"/>
  <rect x="0" y="638" width="600" height="60" fill="url(#floor)"/>

  <!-- Stools -->
  <g id="stools">
    <g>
      <rect x="107" y="584" width="7" height="118" fill="url(#chrome)"/>
      <ellipse cx="110" cy="658" rx="22" ry="5" fill="none" stroke="url(#chrome)" stroke-width="3"/>
      <ellipse cx="110" cy="703" rx="28" ry="6" fill="#9ca3af"/>
      <ellipse cx="110" cy="582" rx="44" ry="13" fill="#0b0b0b" stroke="#2f2f2f" stroke-width="2"/>
      <ellipse cx="104" cy="578" rx="26" ry="5" fill="#ffffff" fill-opacity="0.07"/>
    </g>
    <g>
      <rect x="237" y="584" width="7" height="118" fill="url(#chrome)"/>
      <ellipse cx="240" cy="658" rx="22" ry="5" fill="none" stroke="url(#chrome)" stroke-width="3"/>
      <ellipse cx="240" cy="703" rx="28" ry="6" fill="#9ca3af"/>
      <ellipse cx="240" cy="582" rx="44" ry="13" fill="#0b0b0b" stroke="#2f2f2f" stroke-width="2"/>
      <ellipse cx="234" cy="578" rx="26" ry="5" fill="#ffffff" fill-opacity="0.07"/>
    </g>
    <g>
      <rect x="367" y="584" width="7" height="118" fill="url(#chrome)"/>
      <ellipse cx="370" cy="658" rx="22" ry="5" fill="none" stroke="url(#chrome)" stroke-width="3"/>
      <ellipse cx="370" cy="703" rx="28" ry="6" fill="#9ca3af"/>
      <ellipse cx="370" cy="582" rx="44" ry="13" fill="#0b0b0b" stroke="#2f2f2f" stroke-width="2"/>
      <ellipse cx="364" cy="578" rx="26" ry="5" fill="#ffffff" fill-opacity="0.07"/>
    </g>
    <g>
      <rect x="497" y="584" width="7" height="118" fill="url(#chrome)"/>
      <ellipse cx="500" cy="658" rx="22" ry="5" fill="none" stroke="url(#chrome)" stroke-width="3"/>
      <ellipse cx="500" cy="703" rx="28" ry="6" fill="#9ca3af"/>
      <ellipse cx="500" cy="582" rx="44" ry="13" fill="#0b0b0b" stroke="#2f2f2f" stroke-width="2"/>
      <ellipse cx="494" cy="578" rx="26" ry="5" fill="#ffffff" fill-opacity="0.07"/>
    </g>
  </g>

  <rect width="600" height="720" fill="url(#vig)"/>
</svg>
